apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
  - name: backup
    interval: 1m
    rules:
    # Scripts push 0 for failure, 1 for success - alert when failure is reported
    - alert: BackupFailed
      expr: |
        backup_status{status="failed"} == 0
        or on(instance, backup_type) backup_failure_count > 0
      for: 0m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "Backup {{ $labels.backup_type }} failed"
        description: "{{ $labels.backup_type }} backup failed on {{ $labels.instance }}"

    - alert: BackupNotRun
      expr: (time() - backup_last_success_timestamp{backup_type="database"}) > 86400
      for: 1h
      labels:
        severity: high
        component: backup
      annotations:
        summary: "Backup {{ $labels.backup_type }} has not run in 24 hours"
        description: "{{ $labels.backup_type }} backup last ran more than 24 hours ago on {{ $labels.instance }}"

    - alert: NFSMountFailed
      expr: node_filesystem_avail_bytes{mountpoint=~"/mnt/backup.*|/backup.*|/nfs.*"} == 0
      for: 2m
      labels:
        severity: critical
        component: backup
      annotations:
        summary: "NFS backup mount failed"
        description: "NFS backup mountpoint {{ $labels.mountpoint }} is not available on {{ $labels.instance }}"
