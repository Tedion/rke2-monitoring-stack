# Prometheus Operator Helm Values - Production Configuration with SMTP & Slack
# Updated: Fixed alerting issues and added LGTM stack support

prometheusOperator:
  enabled: true
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  admissionWebhooks:
    enabled: true
    failurePolicy: Ignore

# Suppress noisy default rules that don't work with RKE2
defaultRules:
  rules:
    etcd: false  # RKE2 uses single-node embedded etcd, default rules expect 3+ members
    kubeProxy: false  # RKE2 doesn't expose kube-proxy metrics the same way

prometheus:
  enabled: true
  prometheusSpec:
    retention: 60d
    retentionSize: 50GB
    evaluationInterval: 30s
    scrapeInterval: 30s
    scrapeTimeout: 10s
    
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: "nfs-csi"
          resources:
            requests:
              storage: 200Gi
    
    externalLabels:
      cluster: "rke2-production"
      environment: "production"
    
    additionalScrapeConfigs:
      - job_name: 'pushgateway'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: 'prometheus-pushgateway'
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: 'http'
            action: keep
      
      # External Node Exporters
      - job_name: "external-node-exporters"
        static_configs:
          - targets:
            - "172.16.16.223:9100"  # Rancher
            - "172.16.16.224:9100"  # OpenG2P master
            - "172.16.16.226:9100"  # OpenG2P worker-1
            - "172.16.16.227:9100"  # OpenG2P worker-2
            - "172.16.16.228:9100"  # Nginx
            - "172.16.16.229:9100"  # DB
            - "172.16.16.231:9100"  # MinIO
            - "172.16.16.232:9100"  # Metabase
            labels:
              environment: "external"
              cluster: "rke2-production"
        scrape_interval: 30s
        scrape_timeout: 10s
      
      # External PostgreSQL exporter on DB VM (172.16.16.229)
      - job_name: "external-postgresql"
        static_configs:
          - targets:
            - "172.16.16.229:9187"  # PostgreSQL exporter port
            labels:
              service: postgresql
              instance: "172.16.16.229"
              environment: "external"
              cluster: "rke2-production"
        scrape_interval: 15s
        scrape_timeout: 10s
      
      # Blackbox HTTP probes - symptom-based monitoring (Google SRE philosophy)
      # TODO: Replace placeholder targets with actual OpenG2P endpoints
      - job_name: "blackbox-http"
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
            # TODO: Add your actual OpenG2P HTTP endpoints here
            # Example:
            # - "https://openg2p.example.com/api/health"
            # - "https://openg2p.example.com/"
            - "http://example.com"  # Placeholder - replace with real endpoints
            labels:
              probe_type: "http"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: prometheus-blackbox-exporter.monitoring:9115
      
      # TCP probe for PostgreSQL port (backup check)
      - job_name: "tcp-probe-postgresql"
        metrics_path: /probe
        params:
          module: [tcp_connect]
        static_configs:
          - targets:
            - "172.16.16.229:5432"  # PostgreSQL port
            labels:
              service: postgresql
              instance: "172.16.16.229"
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: prometheus-blackbox-exporter.monitoring:9115
      
      # RKE2 etcd metrics (requires etcd client certs)
      # NOTE: RKE2 etcd certs are at /var/lib/rancher/rke2/server/tls/etcd/
      # Create a k8s secret from them:
      # kubectl create secret generic etcd-client-cert -n monitoring \
      #   --from-file=ca.crt=/var/lib/rancher/rke2/server/tls/etcd/server-ca.crt \
      #   --from-file=tls.crt=/var/lib/rancher/rke2/server/tls/etcd/server-client.crt \
      #   --from-file=tls.key=/var/lib/rancher/rke2/server/tls/etcd/server-client.key
      # Then mount this secret in prometheus.prometheusSpec.secrets: ["etcd-client-cert"]
      - job_name: "etcd"
        scheme: https
        tls_config:
          ca_file: /etc/prometheus/secrets/etcd-client-cert/ca.crt
          cert_file: /etc/prometheus/secrets/etcd-client-cert/tls.crt
          key_file: /etc/prometheus/secrets/etcd-client-cert/tls.key
          insecure_skip_verify: false
        static_configs:
          - targets: ['127.0.0.1:2379']
            labels:
              component: etcd
              cluster: "rke2-production"
        scrape_interval: 30s
        scrape_timeout: 10s
      
      # CoreDNS metrics
      - job_name: "coredns"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - kube-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            regex: 'kube-dns'
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: 'metrics'
            action: keep
        scrape_interval: 30s
        scrape_timeout: 10s
    
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    
    ruleSelector:
      matchLabels:
        prometheus: kube-prometheus
        role: alert-rules
    ruleNamespaceSelector: {}
    
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
    
    # Mount etcd client certs secret (uncomment after creating the secret)
    # secrets:
    #   - etcd-client-cert
    
    resources:
      limits:
        cpu: 4000m
        memory: 8Gi
      requests:
        cpu: 1000m
        memory: 4Gi
    
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    
    replicas: 1

alertmanager:
  enabled: true
  
  # Alertmanager configuration
  config:
    global:
      resolve_timeout: 5m
      # SMTP configuration - reading password from secret file
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'tedionabera@gmail.com'
      smtp_auth_username: 'tedionabera@gmail.com'
      smtp_auth_password_file: '/etc/alertmanager/secrets/alertmanager-smtp/smtp_password'
      smtp_require_tls: true
    
    # Improved inhibit rules - prevent alert storms
    inhibit_rules:
      # Critical suppresses high for same alertname+instance
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'high'
        equal: ['alertname', 'instance']
      # Critical suppresses warning for same alertname+instance
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'instance', 'cluster']
      # High suppresses warning for same alertname+instance
      - source_match:
          severity: 'high'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'instance']
      # High suppresses low alerts
      - source_match:
          severity: 'high'
        target_match:
          severity: 'low'
        equal: ['alertname', 'instance']
    
    # Route configuration - DevOps best practices
    route:
      receiver: 'default'
      group_by: ['alertname', 'cluster', 'severity', 'component']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      
      routes:
      # DATABASE ROUTE - FIRST (highest priority, immediate notification)
      - match:
          component: database
        receiver: 'critical-alerts'
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 30m
        continue: false
      
      # MESSAGING ROUTE - High priority (Kafka/Redis down = cascading failures)
      - match:
          component: messaging
        receiver: 'critical-alerts'
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 30m
        continue: false
      
      # CRITICAL: Immediate notification via BOTH Email AND Slack
      - match:
          severity: critical
        receiver: 'critical-alerts'
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 1h
        continue: false
        
      # HIGH: Notify via BOTH Email AND Slack (less frequent)
      - match:
          severity: high
        receiver: 'high-alerts'
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 6h
        continue: false
        
      # WARNING: Slack only (no email spam)
      - match:
          severity: warning
        receiver: 'warning-alerts'
        group_wait: 1m
        group_interval: 15m
        repeat_interval: 12h
        continue: false
        
      # LOW/INFO: Slack only, less frequent
      - match:
          severity: low
        receiver: 'low-alerts'
        group_wait: 5m
        group_interval: 30m
        repeat_interval: 24h
        continue: false
    
    # Receivers configuration
    receivers:
    # Default receiver - both channels
    - name: 'default'
      email_configs:
      - to: 'tedionabera@gmail.com'
        send_resolved: true
        headers:
          Subject: 'Alert: {{ .GroupLabels.alertname }} - {{ .Status }}'
      slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack/webhook_url'
        channel: '#alerts'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    
    # CRITICAL ALERTS: BOTH Email AND Slack (DevOps standard)
    - name: 'critical-alerts'
      email_configs:
      - to: 'tedionabera@gmail.com'
        send_resolved: true
        headers:
          Subject: '[🚨 CRITICAL] {{ .GroupLabels.alertname }} - Action Required'
        html: |
          <h2>🚨 CRITICAL ALERT</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
          <p><strong>Cluster:</strong> {{ .GroupLabels.cluster }}</p>
          <hr>
          <p><strong>Description:</strong></p>
          <p>{{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p>
          <p><strong>Summary:</strong></p>
          <p>{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}</p>
          <hr>
          <p><small>Alert fired at: {{ .StartsAt }}</small></p>
      slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack/webhook_url'
        channel: '#alerts'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: |
          *🚨 CRITICAL ALERT - IMMEDIATE ACTION REQUIRED 🚨*
          
          *Alert Name:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .GroupLabels.severity }}
          *Component:* {{ .GroupLabels.component }}
          *Cluster:* {{ .GroupLabels.cluster }}
          
          *Description:*
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          
          *Summary:*
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          
          *Fired At:* {{ .StartsAt }}
          *Status:* {{ .Status }}
        send_resolved: true
        color: 'danger'
        footer: 'Prometheus Alertmanager'
    
    # HIGH ALERTS: BOTH Email AND Slack
    - name: 'high-alerts'
      email_configs:
      - to: 'tedionabera@gmail.com'
        send_resolved: true
        headers:
          Subject: '[⚠️ HIGH] {{ .GroupLabels.alertname }}'
        html: |
          <h2>⚠️ HIGH PRIORITY ALERT</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
          <p><strong>Description:</strong> {{ range .Alerts }}{{ .Annotations.description }}{{ end }}</p>
      slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack/webhook_url'
        channel: '#alerts'
        title: '⚠️ HIGH: {{ .GroupLabels.alertname }}'
        text: |
          *⚠️ HIGH PRIORITY ALERT*
          
          *Alert Name:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .GroupLabels.severity }}
          *Component:* {{ .GroupLabels.component }}
          
          *Description:*
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          
          *Summary:*
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
        send_resolved: true
        color: 'warning'
        footer: 'Prometheus Alertmanager'
    
    # WARNING ALERTS: Slack only (no email spam)
    - name: 'warning-alerts'
      slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack/webhook_url'
        channel: '#alerts'
        title: 'ℹ️ WARNING: {{ .GroupLabels.alertname }}'
        text: |
          *ℹ️ WARNING ALERT*
          
          *Alert Name:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .GroupLabels.severity }}
          *Component:* {{ .GroupLabels.component }}
          
          *Description:*
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
        color: 'good'
        footer: 'Prometheus Alertmanager'
    
    # LOW/INFO ALERTS: Slack only
    - name: 'low-alerts'
      slack_configs:
      - api_url_file: '/etc/alertmanager/secrets/alertmanager-slack/webhook_url'
        channel: '#alerts'
        title: 'ℹ️ INFO: {{ .GroupLabels.alertname }}'
        text: |
          *ℹ️ INFO ALERT*
          
          *Alert Name:* {{ .GroupLabels.alertname }}
          *Severity:* {{ .GroupLabels.severity }}
          
          *Description:*
          {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: false
        color: '#439FE0'
        footer: 'Prometheus Alertmanager'
  
  # Alertmanager resources and HA
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp
      - alertmanager-slack
    extraSecretMounts:
      - name: smtp-secret
        secretName: alertmanager-smtp
        defaultMode: 0400
        mountPath: /etc/alertmanager/smtp
      - name: slack-secret
        secretName: alertmanager-slack
        defaultMode: 0400
        mountPath: /etc/alertmanager/slack

    # Fixed: Changed from 2 to 1 replica to fix AlertmanagerClusterDown noise
    replicas: 1
    retention: 120h
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: "nfs-csi"
          resources:
            requests:
              storage: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000

grafana:
  enabled: true
  adminUser: admin
  adminPassword: "CHANGE_ME_IN_PRODUCTION"
  
  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/"
      serve_from_sub_path: false
    security:
      admin_user: admin
    auth:
      disable_login_form: false
      disable_signout_menu: false
  
  # Fixed: Persistence was already enabled, keeping it
  persistence:
    enabled: true
    type: pvc
    storageClassName: "nfs-csi"
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi
  
  service:
    type: ClusterIP
    port: 80
  
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
      - name: 'kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/kubernetes
  
  dashboards:
    default:
      kubernetes-overview:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 27
        datasource: Prometheus
      prometheus-stats:
        gnetId: 2
        revision: 1
        datasource: Prometheus
      alertmanager-overview:
        gnetId: 9578
        revision: 4
        datasource: Prometheus
    kubernetes:
      kubernetes-cluster-monitoring:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      k8s-pod-resources:
        gnetId: 17375
        revision: 1
        datasource: Prometheus
      etcd:
        gnetId: 3070
        revision: 3
        datasource: Prometheus
      coredns:
        gnetId: 5926
        revision: 3
        datasource: Prometheus
  
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        isDefault: false
        editable: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        editable: true
      # Tempo datasource for distributed tracing (LGTM stack)
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo-query-frontend.monitoring.svc.cluster.local:3200
        editable: true
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
          tracesToMetrics:
            datasourceUid: prometheus
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

nodeExporter:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 180Mi
    requests:
      cpu: 100m
      memory: 180Mi

kubeStateMetrics:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

prometheus-node-exporter:
  enabled: true
